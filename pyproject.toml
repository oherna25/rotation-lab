[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rotation-lab"
version = "0.1.0"
description = "Intermarket Relative Rotation Graph (RRG) + Larry Williams-style seasonality analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "plotly>=5.20"]
interactive = ["streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
rotation-lab = "rotation_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rotation_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
