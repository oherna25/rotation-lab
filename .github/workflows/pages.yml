name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 22:15 UTC, Monday–Friday: after the US cash close in both EST and EDT.
    - cron: "15 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build site
        timeout-minutes: 10
        run: |
          set +e
          rotation-lab run --out site --theme light --quiet
          code=$?
          set -e
          if [ "$code" -ne 0 ] || [ ! -f site/index.html ]; then
            echo "Live build failed (exit $code); publishing the labelled synthetic book instead."
            rotation-lab run --offline --out site --theme light --quiet
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
